name: build-wr1204s

# Compiles an ImmortalWrt image for the Tenbay WR1204S
# (Siflower SF19A2890 + Airoha AN8855, 128 MiB RAM, 16 MiB SPI NOR).
#
# Runtime: 2-4 h on the free runner. Disk use peaks around 45 GB,
# which is why the runner's default 14 GB root is freed up first.
#
# Artifacts land in the run summary: sysupgrade.bin (flash from the router)
# and initramfs (run from RAM, touches nothing).

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base tree'
        required: true
        default: immortal
        type: choice
        options: [immortal, ulli, bleach]
      minimal:
        description: 'Minimal image (no LuCI, smallest rootfs)'
        required: false
        default: false
        type: boolean
      prepare_only:
        description: 'Preflight only: stop after kernel patches apply (~10 min, no image)'
        required: false
        default: false
        type: boolean
  push:
    # Branch name doubles as the parameter set, so a build can be started with
    # a plain `git push` and no token:
    #   preflight       -> base bleach, stop after kernel patches (~10 min)
    #   build-bleach    -> base bleach, full image
    #   build-immortal  -> base immortal, full image
    #   build-ulli      -> base ulli, full image
    branches: [main, preflight, build-bleach, build-immortal, build-ulli]
    paths-ignore: ['**.md', 'out/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          echo "after:"; df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev \
            python3-setuptools python3-dev rsync unzip zlib1g-dev file wget \
            subversion patch bc

      - name: Show tools
        run: |
          gcc --version | head -1
          python3 --version
          nproc
          free -h
          df -h /

      - name: Build
        id: build
        run: |
          chmod +x build.sh
          ARGS="--jobs $(nproc)"
          BASE="${{ inputs.base }}"
          MIN="${{ inputs.minimal }}"
          PREP="${{ inputs.prepare_only }}"
          case "${GITHUB_REF_NAME}" in
            preflight)      BASE=bleach;   PREP=true  ;;
            build-bleach)   BASE=bleach;   PREP=false ;;
            build-immortal) BASE=immortal; PREP=false ;;
            build-ulli)     BASE=ulli;     PREP=false ;;
          esac
          [ -n "$BASE" ] || BASE=immortal
          echo "base=$BASE minimal=${MIN:-false} prepare_only=${PREP:-false}"
          ARGS="$ARGS --base $BASE"
          if [ "${MIN:-false}" = "true" ]; then
            ARGS="$ARGS --min"
          fi
          if [ "${PREP:-false}" = "true" ]; then
            ARGS="$ARGS --prepare"
          fi
          echo "running: ./build.sh $ARGS"
          echo "prepare_only=${PREP:-false}" >> "$GITHUB_OUTPUT"
          echo "base=$BASE"                   >> "$GITHUB_OUTPUT"
          # pipefail matters: without it the pipeline exits with tee's status and
          # a failed build reports green.
          set -o pipefail
          ./build.sh $ARGS 2>&1 | tee build.log

      - name: Publish log tail
        if: always()
        run: |
          for f in build.log prepare.log; do
            [ -f "$f" ] || continue
            {
              echo "### $f — last 120 lines"
              echo '```'
              tail -120 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Archive log to ci-log branch
        if: failure()
        run: |
          mkdir -p /tmp/ci
          cp build.log prepare.log /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci
          git init -q
          git config user.name  "ci"
          git config user.email "ci@local"
          git add -A
          git commit -qm "ci log $(date -u +%FT%TZ) ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-log

      - name: Verify artifacts
        if: always()
        run: |
          echo "=== out/ ==="
          ls -la out/ 2>/dev/null || echo "(no out/ directory)"
          for f in out/*; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f")"
            echo "    size   : $(wc -c < "$f") bytes"
            echo "    sha256 : $(sha256sum "$f" | cut -d' ' -f1)"
            file "$f"
          done

      - name: Upload firmware
        if: success() && steps.build.outputs.prepare_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wr1204s-${{ steps.build.outputs.base }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7
