name: build-wr1204s

# Compiles an ImmortalWrt image for the Tenbay WR1204S
# (Siflower SF19A2890 + Airoha AN8855, 128 MiB RAM, 16 MiB SPI NOR).
#
# Runtime: 2-4 h on the free runner. Disk use peaks around 45 GB,
# which is why the runner's default 14 GB root is freed up first.
#
# Artifacts land in the run summary: sysupgrade.bin (flash from the router)
# and initramfs (run from RAM, touches nothing).

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base tree'
        required: true
        default: immortal
        type: choice
        options: [immortal, ulli, bleach]
      minimal:
        description: 'Minimal image (no LuCI, smallest rootfs)'
        required: false
        default: false
        type: boolean
      prepare_only:
        description: 'Preflight only: stop after kernel patches apply (~10 min, no image)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths-ignore: ['**.md', 'out/**']

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          echo "after:"; df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev \
            python3-setuptools python3-dev rsync unzip zlib1g-dev file wget \
            subversion patch bc

      - name: Show tools
        run: |
          gcc --version | head -1
          python3 --version
          nproc
          free -h
          df -h /

      - name: Build
        id: build
        run: |
          chmod +x build.sh
          ARGS="--jobs $(nproc)"
          case "${{ inputs.base || 'immortal' }}" in
            ulli)   ARGS="$ARGS --base ulli" ;;
            bleach) ARGS="$ARGS --base bleach" ;;
            *)      ARGS="$ARGS --base immortal" ;;
          esac
          if [ "${{ inputs.minimal || 'false' }}" = "true" ]; then
            ARGS="$ARGS --min"
          fi
          if [ "${{ inputs.prepare_only || 'false' }}" = "true" ]; then
            ARGS="$ARGS --prepare"
          fi
          echo "running: ./build.sh $ARGS"
          ./build.sh $ARGS 2>&1 | tee build.log

      - name: Verify artifacts
        if: always()
        run: |
          echo "=== out/ ==="
          ls -la out/ 2>/dev/null || echo "(no out/ directory)"
          for f in out/*; do
            [ -f "$f" ] || continue
            echo "--- $(basename "$f")"
            echo "    size   : $(wc -c < "$f") bytes"
            echo "    sha256 : $(sha256sum "$f" | cut -d' ' -f1)"
            file "$f"
          done

      - name: Upload firmware
        if: success() && inputs.prepare_only != true
        uses: actions/upload-artifact@v4
        with:
          name: wr1204s-${{ inputs.base || 'immortal' }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7
